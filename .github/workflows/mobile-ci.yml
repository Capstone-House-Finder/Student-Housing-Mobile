name: Mobile CI
on:
  push:
    branches: [develop, main, 'release/**', 'hotfix/**']
  pull_request:
    branches: [develop, main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mobile-app
      - uses: actions/checkout@v4
        with:
          repository: Capstone-House-Finder/Student-Housing
          path: web-platform
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd mobile-app && npm ci
      - run: cd mobile-app && npx tsc --noEmit
      - run: cd mobile-app && npm run lint
      - run: cd mobile-app && npx expo export --platform android --dev false
